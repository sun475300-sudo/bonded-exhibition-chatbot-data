name: CI - 테스트 & 린트

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 린트 (Ruff)
        run: ruff check src/ web_server.py --select E,F,W --ignore E501

      - name: 테스트
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short -ra \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_full_integration.py \
            --ignore=tests/test_performance.py \
            -x 2>&1 | tee pytest-output.log
        continue-on-error: false

      - name: 실패 로그 요약 (Job Summary 게시)
        if: failure()
        run: |
          echo "## pytest 실패 요약 (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 pytest-output.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 로그 PR 코멘트 게시 (디버깅)
        if: failure() && github.event_name == 'pull_request' && matrix.python-version == '3.11'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### 🔴 CI test (3.11) 실패 로그 (마지막 200줄)"
            echo
            echo '```'
            tail -n 200 pytest-output.log || true
            echo '```'
          } > comment-body.md
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "$(jq -Rs '{body: .}' comment-body.md)" || echo "comment post failed"

      - name: 커버리지 리포트
        if: matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_full_integration.py \
            --ignore=tests/test_performance.py \
            --cov=src --cov=web_server --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker 빌드 테스트
        run: docker build -t bonded-chatbot:test .

      - name: 컨테이너 헬스 체크
        run: |
          docker run -d --name test-chatbot -p 8080:8080 bonded-chatbot:test
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          docker stop test-chatbot
