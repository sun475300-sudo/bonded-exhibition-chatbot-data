name: CI - 테스트 & 린트

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: 린트 (Ruff)
        run: ruff check src/ web_server.py --select E,F,W --ignore E501

      - name: 빠른 테스트 (단위/통합)
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_full_integration.py \
            --ignore=tests/test_performance.py \
            -x

      - name: 커버리지 리포트 + 임계 검사
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_full_integration.py \
            --ignore=tests/test_performance.py \
            --cov=src --cov=web_server --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=80

      - name: 커버리지 아티팩트 업로드
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # ── 장기 / E2E / 성능 테스트 (별 잡) ──────────────────────────
  # 빠른 PR 피드백을 막지 않도록 분리. workflow_dispatch + 매주 실행.
  test-long:
    name: 테스트 (E2E + Full Integration + Performance)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: E2E 테스트
        run: python -m pytest tests/test_e2e.py -q --tb=short
        continue-on-error: true

      - name: Full Integration 테스트
        run: python -m pytest tests/test_full_integration.py -q --tb=short
        continue-on-error: true

      - name: Performance 테스트
        run: python -m pytest tests/test_performance.py -q --tb=short
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker 빌드 테스트
        run: docker build -t bonded-chatbot:test .

      - name: 컨테이너 헬스 체크
        run: |
          docker run -d --name test-chatbot -p 8080:8080 bonded-chatbot:test
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          docker stop test-chatbot
